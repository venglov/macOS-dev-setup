name: Check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test dependencies in the disposable runner
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y zsh
            asset=linux_amd64
            digest=9f97d32caca166e5c92160ec3a9325519809c38963121cef38173142065c981f
          else
            test "$(uname -m)" = arm64
            asset=darwin_arm64
            digest=938d422091cc001e68fe3fd7efea9b923a36facbf2b8db67063639abbaf72de2
          fi
          test_tools=$(mktemp -d "$RUNNER_TEMP/chezmoi.XXXXXXXX")
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/twpayne/chezmoi/releases/download/v2.72.1/chezmoi_2.72.1_$asset.tar.gz" \
            --output "$test_tools/chezmoi.tar.gz"
          echo "$digest  $test_tools/chezmoi.tar.gz" | shasum -a 256 -c -
          tar -xzf "$test_tools/chezmoi.tar.gz" -C "$test_tools" chezmoi
          echo "$test_tools" >> "$GITHUB_PATH"
      - name: Render, apply twice, and check zsh without touching the runner's home
        shell: bash
        run: |
          test_home=$(mktemp -d "$RUNNER_TEMP/dotfiles.XXXXXXXX")
          trap 'rm -rf "$test_home"' EXIT
          cm() {
            env -i HOME="$test_home" PATH="$PATH" \
              chezmoi --source "$GITHUB_WORKSPACE" --no-tty "$@"
          }
          printf 'yes\n' | cm init
          cm diff
          cm apply
          env -i HOME="$test_home" PATH="$PATH" git config --file "$test_home/.gitconfig" user.name 'Setup Test'
          env -i HOME="$test_home" PATH="$PATH" git config --file "$test_home/.gitconfig" user.email setup@example.invalid
          cm apply
          cm verify
          test "$(env -i HOME="$test_home" PATH="$PATH" git config --global user.email)" = setup@example.invalid
          zsh -n "$test_home/.zshenv"
          zsh -n "$test_home/.zprofile"
          zsh -n "$test_home/.zshrc"
          zsh -n "$test_home/.zimrc"
          test "$(env -i HOME="$test_home" PATH=/usr/bin:/bin zsh -c 'printf ok')" = ok
          if [[ "$RUNNER_OS" == macOS ]]; then
            env -i HOME="$test_home" PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/zsh -lc '
              [[ $HOMEBREW_PREFIX == /opt/homebrew ]] &&
              [[ ${commands[brew]} == /opt/homebrew/bin/brew ]]
            '
          fi
          git diff --exit-code
